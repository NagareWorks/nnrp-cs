name: CI

env:
  NNRP_DOC_SOURCE_COMMIT: 3439ded0d318bd736f6485b17f2563fae77627bf
  NNRP_CONFORMANCE_SOURCE_COMMIT: 05dc6d8283d0941b129f1c5a93e399b97153d38b
  NNRP_RS_SOURCE_COMMIT: 295f5b65ac71885b5c1b54d927b2595005038481
  NNRP_RS_CI_RUN_ID: '31666390775'

on:
  push:
    branches:
      - develop
      - main
      - release/**
  pull_request:
  workflow_dispatch:

jobs:
  content-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject prohibited vendor/model references
        id: content_policy
        shell: bash
        run: |
          set +e
          first_term="Anthro""pic"
          second_term="Clau""de"
          output="$(
            set -euo pipefail
            violations=0
            for term in "$first_term" "$second_term"; do
              matches="$(git grep -n -I -i -F -- "$term" -- . || true)"
              if [ -n "$matches" ]; then
                echo "Tracked file content contains prohibited keyword: $term"
                echo "$matches"
                violations=1
              fi
            done

            if [ "${{ github.event_name }}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
            fi

            if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              messages="$(git log --format=%B "$base..$head")"
            else
              messages="$(git log --format=%B -n 1 "$head")"
            fi

            for term in "$first_term" "$second_term"; do
              if grep -qiF -- "$term" <<< "$messages"; then
                echo "Commit message contains prohibited keyword: $term"
                violations=1
              fi
            done

            exit "$violations"
          )"
          status="$?"
          {
            echo "output<<EOF"
            echo "$output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$output"
          exit "$status"

      - name: Close prohibited-content PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          POLICY_OUTPUT: ${{ steps.content_policy.outputs.output }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "This PR was closed automatically because it violates the repository content policy."
            echo
            echo "Prohibited vendor/model references are not accepted in code or commit messages."
            echo
            echo '```text'
            printf '%s\n' "$POLICY_OUTPUT"
            echo '```'
          } > content-policy-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file content-policy-comment.md
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify change set
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "$base" "$head")

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          for path in "${changed_files[@]}"; do
            if [[ "$path" == "Packages/com.nnrp.client/README.md" ]]; then
              docs_only=false
              break
            fi

            if [[ "$path" == *.md ]] || [[ "$path" =~ ^(doc/|docs/|\.github/PULL_REQUEST_TEMPLATE/) ]] || [[ "$path" =~ ^\.github/[^/]+\.md$ ]]; then
              continue
            fi

            docs_only=false
            break
          done

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  commit-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Enforce single-commit PR policy
        shell: bash
        run: |
          set -euo pipefail

          head_ref="${{ github.head_ref }}"
          base_ref="${{ github.base_ref }}"

          if [[ "$head_ref" =~ ^release/ ]] || [[ "$base_ref" =~ ^release/ ]]; then
            echo "Release/version branch PR detected; multi-commit history is allowed when needed."
            exit 0
          fi

          if [ "$head_ref" = "develop" ] && [ "$base_ref" = "main" ]; then
            echo "Develop-to-main integration PR detected; preserving reviewed integration history is allowed."
            exit 0
          fi

          commit_count='${{ github.event.pull_request.commits }}'
          if [ "$commit_count" -ne 1 ]; then
            echo "Normal PRs from feature/fix/docs/chore branches must contain exactly one commit before review. Current PR has $commit_count commits. Squash the history before requesting review."
            exit 1
          fi

  build-test:
    needs:
      - changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Checkout nnrp-conformance action
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nnrp-conformance
          ref: ${{ env.NNRP_CONFORMANCE_SOURCE_COMMIT }}
          path: nnrp-conformance-action
          fetch-depth: 1

      - name: Checkout frozen SDK API contract
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nnrp-doc
          ref: ${{ env.NNRP_DOC_SOURCE_COMMIT }}
          path: nnrp-doc-contract
          fetch-depth: 1

      - name: Validate frozen SDK API contract
        run: >-
          python scripts/check_sdk_api_contract.py
          --contract nnrp-doc-contract/docs/public/contracts/nnrp-1-preview4-sdk-api.json
          --source-root .

      - name: Validate tracked UPM metadata
        shell: pwsh
        run: >-
          python scripts/build_upm_package.py
          --repo-root .
          --tracked-output Packages/com.nnrp.client
          --validate-tracked-metadata
          --repository-url https://github.com/${{ github.repository }}

      - name: Test UPM package metadata generation
        run: python -m unittest discover -s tests/Packaging.Tests -p "test_*.py"

      - name: Restore
        run: dotnet restore Nnrp.sln

      - name: Build
        run: dotnet build Nnrp.sln --configuration Release --no-restore

      - name: Test with coverage
        shell: pwsh
        run: |
          $coverageRoot = Join-Path $PWD "artifacts/test-results"
          function Invoke-CoveredTest {
            param(
              [string]$ProjectPath,
              [string]$ArtifactName,
              [string]$IncludeFilter,
              [int]$Threshold = 0
            )

            $resultsDirectory = Join-Path $coverageRoot $ArtifactName
            $coverageDirectory = Join-Path $resultsDirectory "coverage"

            $arguments = @(
              "test",
              $ProjectPath,
              "--configuration", "Release",
              "--no-build",
              "--logger", "trx;LogFileName=$ArtifactName.trx",
              "--results-directory", $resultsDirectory,
              "/p:CollectCoverage=true",
              "/p:CoverletOutputFormat=cobertura",
              "/p:CoverletOutput=$coverageDirectory/",
              "/p:Include=$IncludeFilter"
            )

            if ($Threshold -gt 0) {
              $arguments += @(
                "/p:Threshold=$Threshold",
                "/p:ThresholdType=line",
                "/p:ThresholdStat=total"
              )
            }

            & dotnet @arguments
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          Invoke-CoveredTest -ProjectPath "tests/Nnrp.Core.Tests/Nnrp.Core.Tests.csproj" -ArtifactName "Nnrp.Core.Tests" -IncludeFilter "[Nnrp.Core]*%2c[Nnrp.ConformanceAdapter]*%2c[Nnrp.WireConformance]*" -Threshold 90
          Invoke-CoveredTest -ProjectPath "tests/Nnrp.Client.Tests/Nnrp.Client.Tests.csproj" -ArtifactName "Nnrp.Client.Tests" -IncludeFilter "[Nnrp.Client]*" -Threshold 90
          Invoke-CoveredTest -ProjectPath "tests/Nnrp.Server.Tests/Nnrp.Server.Tests.csproj" -ArtifactName "Nnrp.Server.Tests" -IncludeFilter "[Nnrp.Server]*" -Threshold 90
          Invoke-CoveredTest -ProjectPath "tests/Nnrp.Transport.Tcp.Tests/Nnrp.Transport.Tcp.Tests.csproj" -ArtifactName "Nnrp.Transport.Tcp.Tests" -IncludeFilter "[Nnrp.Transport.Tcp]*" -Threshold 90
          Invoke-CoveredTest -ProjectPath "tests/Nnrp.Transport.Quic.Tests/Nnrp.Transport.Quic.Tests.csproj" -ArtifactName "Nnrp.Transport.Quic.Tests" -IncludeFilter "[Nnrp.Transport.Quic]*" -Threshold 90
          Invoke-CoveredTest -ProjectPath "tests/Nnrp.Transport.Ipc.Tests/Nnrp.Transport.Ipc.Tests.csproj" -ArtifactName "Nnrp.Transport.Ipc.Tests" -IncludeFilter "[Nnrp.Transport.Ipc]*" -Threshold 90
          Invoke-CoveredTest -ProjectPath "tests/Nnrp.Transport.WebSocket.Tests/Nnrp.Transport.WebSocket.Tests.csproj" -ArtifactName "Nnrp.Transport.WebSocket.Tests" -IncludeFilter "[Nnrp.Transport.WebSocket]*" -Threshold 90
          Invoke-CoveredTest -ProjectPath "tests/Nnrp.NativeBridge.Tests/Nnrp.NativeBridge.Tests.csproj" -ArtifactName "Nnrp.NativeBridge.Tests" -IncludeFilter "[Nnrp.NativeBridge]*" -Threshold 90

      - name: Incremental line coverage gate
        shell: pwsh
        run: |
          $baseSha = ""
          $headSha = ""

          git fetch origin main --no-tags --depth=1

          if ("${{ github.event_name }}" -eq "pull_request") {
            $baseSha = "${{ github.event.pull_request.base.sha }}"
            $headSha = "${{ github.event.pull_request.head.sha }}"
          }
          elseif ("${{ github.event_name }}" -eq "push") {
            $baseSha = "${{ github.event.before }}"
            $headSha = "${{ github.sha }}"
          }

          $hasValidBaseSha = $false
          if (-not [string]::IsNullOrWhiteSpace($baseSha) -and $baseSha -ne "0000000000000000000000000000000000000000") {
            git cat-file -e "${baseSha}^{commit}" 2>$null
            $hasValidBaseSha = ($LASTEXITCODE -eq 0)
          }

          if (-not $hasValidBaseSha) {
            $baseSha = (git merge-base HEAD origin/main).Trim()
          }

          if ([string]::IsNullOrWhiteSpace($headSha)) {
            $headSha = (git rev-parse HEAD).Trim()
          }

          ./scripts/check_incremental_coverage.ps1 -BaseSha $baseSha -HeadSha $headSha -Threshold 90 -CoverageRoot (Join-Path $PWD "artifacts/test-results")

      - name: Upload test result artifacts
        if: always() && hashFiles('artifacts/test-results/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: error

      - name: Format check
        run: dotnet format Nnrp.sln --verify-no-changes --verbosity minimal

  native-artifacts:
    needs:
      - changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download coordinated nnrp-rs release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/download_nnrp_rs_artifacts.py
          --version 1.0.0-preview.4.22
          --require-abi-version 4.4.0
          --workflow-run-id 31666415612
          --workflow-head-sha 295f5b65ac71885b5c1b54d927b2595005038481
          --output artifacts/native

      - name: Upload coordinated native artifacts
        uses: actions/upload-artifact@v6
        with:
          name: coordinated-native-artifacts
          path: artifacts/native/
          if-no-files-found: error
          retention-days: 7

  native-e2e:
    needs:
      - changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NNRP_RUN_LIVE_NATIVE_ARTIFACT_SMOKE: '1'
      NNRP_RUN_LIVE_NATIVE_TRANSPORT_TESTS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify final nnrp-rs CI source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $run = gh run view $env:NNRP_RS_CI_RUN_ID `
            --repo "${{ github.repository_owner }}/nnrp-rs" `
            --json headSha,status,conclusion | ConvertFrom-Json
          if ($run.headSha -ne $env:NNRP_RS_SOURCE_COMMIT `
              -or $run.status -ne 'completed' `
              -or $run.conclusion -ne 'success') {
            throw "nnrp-rs CI run does not match the frozen successful source commit."
          }

      - name: Download final nnrp-rs CI artifacts
        uses: actions/download-artifact@v7
        with:
          name: nnrp-ffi-native-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/nnrp-rs-ci
          github-token: ${{ github.token }}
          repository: ${{ github.repository_owner }}/nnrp-rs
          run-id: ${{ env.NNRP_RS_CI_RUN_ID }}

      - name: Stage final native runtime artifacts
        run: >-
          python scripts/stage_nnrp_rs_ci_artifacts.py
          --input artifacts/nnrp-rs-ci
          --output artifacts/native
          --require-abi-version 4.4.0

      - name: Resolve live native artifact paths
        shell: pwsh
        run: |
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture
          $arch = switch ($architecture) {
            ([System.Runtime.InteropServices.Architecture]::X64) { "x64" }
            ([System.Runtime.InteropServices.Architecture]::Arm64) { "arm64" }
            default { throw "Unsupported native E2E architecture: $architecture" }
          }
          if ([System.Runtime.InteropServices.RuntimeInformation]::IsOSPlatform([System.Runtime.InteropServices.OSPlatform]::Windows)) {
            $rid = "win-$arch"
            $library = "nnrp_ffi.dll"
          } elseif ([System.Runtime.InteropServices.RuntimeInformation]::IsOSPlatform([System.Runtime.InteropServices.OSPlatform]::OSX)) {
            $rid = "osx-$arch"
            $library = "libnnrp_ffi.dylib"
          } else {
            $rid = "linux-$arch"
            $library = "libnnrp_ffi.so"
          }

          $tcpArtifact = (Resolve-Path "artifacts/native/transport-tcp/$rid/$library").Path
          $quicArtifact = (Resolve-Path "artifacts/native/transport-quic/$rid/$library").Path
          $ipcArtifact = (Resolve-Path "artifacts/native/transport-ipc/$rid/$library").Path
          $websocketArtifact = (Resolve-Path "artifacts/native/transport-websocket/$rid/$library").Path
          "NNRP_NATIVE_ARTIFACT_PATH=$tcpArtifact" >> $env:GITHUB_ENV
          "NNRP_NATIVE_TCP_ARTIFACT_PATH=$tcpArtifact" >> $env:GITHUB_ENV
          "NNRP_NATIVE_QUIC_ARTIFACT_PATH=$quicArtifact" >> $env:GITHUB_ENV
          "NNRP_NATIVE_IPC_ARTIFACT_PATH=$ipcArtifact" >> $env:GITHUB_ENV
          "NNRP_NATIVE_WEBSOCKET_ARTIFACT_PATH=$websocketArtifact" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore Nnrp.sln

      - name: Build
        run: dotnet build Nnrp.sln --configuration Release --no-restore

      - name: Run native bridge E2E
        run: >-
          dotnet test tests/Nnrp.NativeBridge.Tests/Nnrp.NativeBridge.Tests.csproj
          --configuration Release --no-build

      - name: Run TCP provider E2E
        run: >-
          dotnet test tests/Nnrp.Transport.Tcp.Tests/Nnrp.Transport.Tcp.Tests.csproj
          --configuration Release --no-build

      - name: Run QUIC provider E2E
        run: >-
          dotnet test tests/Nnrp.Transport.Quic.Tests/Nnrp.Transport.Quic.Tests.csproj
          --configuration Release --no-build

      - name: Run IPC provider E2E
        run: >-
          dotnet test tests/Nnrp.Transport.Ipc.Tests/Nnrp.Transport.Ipc.Tests.csproj
          --configuration Release --no-build

      - name: Run WebSocket provider E2E
        run: >-
          dotnet test tests/Nnrp.Transport.WebSocket.Tests/Nnrp.Transport.WebSocket.Tests.csproj
          --configuration Release --no-build

      - name: Run managed client and server role E2E
        run: >-
          dotnet test tests/Nnrp.Client.Tests/Nnrp.Client.Tests.csproj
          --configuration Release --no-build

  native-e2e-windows-x86:
    needs:
      - changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    env:
      NNRP_RUN_LIVE_NATIVE_ARTIFACT_SMOKE: '1'
      NNRP_RUN_LIVE_NATIVE_TRANSPORT_TESTS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup x86 .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          architecture: x86

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify final nnrp-rs CI source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $run = gh run view $env:NNRP_RS_CI_RUN_ID `
            --repo "${{ github.repository_owner }}/nnrp-rs" `
            --json headSha,status,conclusion | ConvertFrom-Json
          if ($run.headSha -ne $env:NNRP_RS_SOURCE_COMMIT `
              -or $run.status -ne 'completed' `
              -or $run.conclusion -ne 'success') {
            throw "nnrp-rs CI run does not match the frozen successful source commit."
          }

      - name: Download final nnrp-rs CI artifacts
        uses: actions/download-artifact@v7
        with:
          name: nnrp-ffi-native-Windows-X86
          path: artifacts/nnrp-rs-ci
          github-token: ${{ github.token }}
          repository: ${{ github.repository_owner }}/nnrp-rs
          run-id: ${{ env.NNRP_RS_CI_RUN_ID }}

      - name: Stage final native runtime artifacts
        run: >-
          python scripts/stage_nnrp_rs_ci_artifacts.py
          --input artifacts/nnrp-rs-ci
          --output artifacts/native
          --require-abi-version 4.4.0

      - name: Resolve x86 live native artifact paths
        shell: pwsh
        run: |
          $tcpArtifact = (Resolve-Path "artifacts/native/transport-tcp/win-x86/nnrp_ffi.dll").Path
          $quicArtifact = (Resolve-Path "artifacts/native/transport-quic/win-x86/nnrp_ffi.dll").Path
          $ipcArtifact = (Resolve-Path "artifacts/native/transport-ipc/win-x86/nnrp_ffi.dll").Path
          $websocketArtifact = (Resolve-Path "artifacts/native/transport-websocket/win-x86/nnrp_ffi.dll").Path
          "NNRP_NATIVE_ARTIFACT_PATH=$tcpArtifact" >> $env:GITHUB_ENV
          "NNRP_NATIVE_TCP_ARTIFACT_PATH=$tcpArtifact" >> $env:GITHUB_ENV
          "NNRP_NATIVE_QUIC_ARTIFACT_PATH=$quicArtifact" >> $env:GITHUB_ENV
          "NNRP_NATIVE_IPC_ARTIFACT_PATH=$ipcArtifact" >> $env:GITHUB_ENV
          "NNRP_NATIVE_WEBSOCKET_ARTIFACT_PATH=$websocketArtifact" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore Nnrp.sln

      - name: Build
        run: dotnet build Nnrp.sln --configuration Release --no-restore

      - name: Run x86 native bridge E2E
        run: >-
          dotnet test tests/Nnrp.NativeBridge.Tests/Nnrp.NativeBridge.Tests.csproj
          --configuration Release --no-build

      - name: Run x86 TCP provider E2E
        run: >-
          dotnet test tests/Nnrp.Transport.Tcp.Tests/Nnrp.Transport.Tcp.Tests.csproj
          --configuration Release --no-build

      - name: Run x86 QUIC provider E2E
        run: >-
          dotnet test tests/Nnrp.Transport.Quic.Tests/Nnrp.Transport.Quic.Tests.csproj
          --configuration Release --no-build

      - name: Run x86 IPC provider E2E
        run: >-
          dotnet test tests/Nnrp.Transport.Ipc.Tests/Nnrp.Transport.Ipc.Tests.csproj
          --configuration Release --no-build

      - name: Run x86 WebSocket provider E2E
        run: >-
          dotnet test tests/Nnrp.Transport.WebSocket.Tests/Nnrp.Transport.WebSocket.Tests.csproj
          --configuration Release --no-build

      - name: Run x86 managed client and server role E2E
        run: >-
          dotnet test tests/Nnrp.Client.Tests/Nnrp.Client.Tests.csproj
          --configuration Release --no-build

  wire-host-route-e2e:
    needs:
      - changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout nnrp-conformance wire suite
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nnrp-conformance
          ref: ${{ env.NNRP_CONFORMANCE_SOURCE_COMMIT }}
          path: nnrp-conformance-wire
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify final nnrp-rs CI source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $run = gh run view $env:NNRP_RS_CI_RUN_ID `
            --repo "${{ github.repository_owner }}/nnrp-rs" `
            --json headSha,status,conclusion | ConvertFrom-Json
          if ($run.headSha -ne $env:NNRP_RS_SOURCE_COMMIT `
              -or $run.status -ne 'completed' `
              -or $run.conclusion -ne 'success') {
            throw "nnrp-rs CI run does not match the frozen successful source commit."
          }

      - name: Download final nnrp-rs CI artifacts
        uses: actions/download-artifact@v7
        with:
          name: nnrp-ffi-native-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/nnrp-rs-ci
          github-token: ${{ github.token }}
          repository: ${{ github.repository_owner }}/nnrp-rs
          run-id: ${{ env.NNRP_RS_CI_RUN_ID }}

      - name: Stage final native runtime artifacts
        run: >-
          python scripts/stage_nnrp_rs_ci_artifacts.py
          --input artifacts/nnrp-rs-ci
          --output artifacts/native
          --require-abi-version 4.4.0

      - name: Run independent host-route wire E2E
        shell: pwsh
        run: >-
          ./scripts/run_wire_host_route_e2e.ps1
          -ConformanceRoot (Join-Path $PWD 'nnrp-conformance-wire')
          -NativeRoot (Join-Path $PWD 'artifacts/native')
          -OutputRoot 'artifacts/wire-host-route-e2e'

      - name: Upload host-route wire evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wire-host-route-e2e-${{ runner.os }}
          path: artifacts/wire-host-route-e2e/
          if-no-files-found: error

  wire-runtime-e2e:
    needs:
      - changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout nnrp-conformance wire suite
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nnrp-conformance
          ref: ${{ env.NNRP_CONFORMANCE_SOURCE_COMMIT }}
          path: nnrp-conformance-wire
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify final nnrp-rs CI source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $run = gh run view $env:NNRP_RS_CI_RUN_ID `
            --repo "${{ github.repository_owner }}/nnrp-rs" `
            --json headSha,status,conclusion | ConvertFrom-Json
          if ($run.headSha -ne $env:NNRP_RS_SOURCE_COMMIT `
              -or $run.status -ne 'completed' `
              -or $run.conclusion -ne 'success') {
            throw "nnrp-rs CI run does not match the frozen successful source commit."
          }

      - name: Download final nnrp-rs CI artifacts
        uses: actions/download-artifact@v7
        with:
          name: nnrp-ffi-native-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/nnrp-rs-ci
          github-token: ${{ github.token }}
          repository: ${{ github.repository_owner }}/nnrp-rs
          run-id: ${{ env.NNRP_RS_CI_RUN_ID }}

      - name: Stage final native runtime artifacts
        run: >-
          python scripts/stage_nnrp_rs_ci_artifacts.py
          --input artifacts/nnrp-rs-ci
          --output artifacts/native
          --require-abi-version 4.4.0

      - name: Run independent runtime-frame wire E2E
        shell: pwsh
        run: >-
          ./scripts/run_wire_runtime_e2e.ps1
          -ConformanceRoot (Join-Path $PWD 'nnrp-conformance-wire')
          -NativeRoot (Join-Path $PWD 'artifacts/native')
          -OutputRoot 'artifacts/wire-runtime-e2e'

      - name: Upload runtime-frame wire evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wire-runtime-e2e-${{ runner.os }}
          path: artifacts/wire-runtime-e2e/
          if-no-files-found: error

  package-validation:
    needs:
      - changes
      - native-artifacts
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download complete coordinated native artifact tree
        uses: actions/download-artifact@v7
        with:
          name: coordinated-native-artifacts
          path: artifacts/native

      - name: Restore
        run: dotnet restore Nnrp.sln

      - name: Build
        run: dotnet build Nnrp.sln --configuration Release --no-restore

      - name: Pack release package graph
        run: >-
          dotnet pack Nnrp.sln --configuration Release --no-build
          --output artifacts/package-validation
          -p:Version=1.0.0-preview.4
          -p:PackageVersion=1.0.0-preview.4
          -p:VersionSuffix=

      - name: Canonicalize NuGet package archives
        run: python scripts/canonicalize_nuget_packages.py --packages artifacts/package-validation

      - name: Verify package boundaries and clean installs
        run: >-
          python scripts/verify_nuget_packages.py
          --packages artifacts/package-validation
          --version 1.0.0-preview.4
          --smoke-install

  conformance:
    needs:
      - changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout nnrp-conformance action
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nnrp-conformance
          ref: ${{ env.NNRP_CONFORMANCE_SOURCE_COMMIT }}
          path: nnrp-conformance-action
          fetch-depth: 1

      - name: Resolve conformance baseline
        id: conformance-baseline
        shell: pwsh
        run: |
          $capabilityFiles = Get-ChildItem (Join-Path $PWD 'conformance') -Filter '*.capabilities.json'
          if ($capabilityFiles.Count -ne 1) {
            throw "Expected exactly one capability manifest under conformance/, found $($capabilityFiles.Count)."
          }

          $capabilityFile = $capabilityFiles[0]
          $capabilityManifest = Get-Content -Raw $capabilityFile.FullName | ConvertFrom-Json
          $protocolVersion = [string]$capabilityManifest.protocol_version
          if ([string]::IsNullOrWhiteSpace($protocolVersion)) {
            throw "Capability manifest does not declare protocol_version: $($capabilityFile.FullName)"
          }

          "protocol-version=$protocolVersion" >> $env:GITHUB_OUTPUT
          "capabilities-path=conformance/$($capabilityFile.Name)" >> $env:GITHUB_OUTPUT
          "artifact-name=nnrp-cs-conformance" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify final nnrp-rs CI source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $run = gh run view $env:NNRP_RS_CI_RUN_ID `
            --repo "${{ github.repository_owner }}/nnrp-rs" `
            --json headSha,status,conclusion | ConvertFrom-Json
          if ($run.headSha -ne $env:NNRP_RS_SOURCE_COMMIT `
              -or $run.status -ne 'completed' `
              -or $run.conclusion -ne 'success') {
            throw "nnrp-rs CI run does not match the frozen successful source commit."
          }

      - name: Download final nnrp-rs CI artifacts
        uses: actions/download-artifact@v7
        with:
          name: nnrp-ffi-native-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/nnrp-rs-ci
          github-token: ${{ github.token }}
          repository: ${{ github.repository_owner }}/nnrp-rs
          run-id: ${{ env.NNRP_RS_CI_RUN_ID }}

      - name: Stage final native runtime artifacts
        run: >-
          python scripts/stage_nnrp_rs_ci_artifacts.py
          --input artifacts/nnrp-rs-ci
          --output artifacts/native
          --require-abi-version 4.4.0

      - name: Resolve conformance native artifact paths
        shell: pwsh
        run: |
          $tcpArtifact = (Resolve-Path "artifacts/native/transport-tcp/win-x64/nnrp_ffi.dll").Path
          $quicArtifact = (Resolve-Path "artifacts/native/transport-quic/win-x64/nnrp_ffi.dll").Path
          "NNRP_NATIVE_TCP_ARTIFACT_PATH=$tcpArtifact" >> $env:GITHUB_ENV
          "NNRP_NATIVE_QUIC_ARTIFACT_PATH=$quicArtifact" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore Nnrp.sln

      - name: Run suite-owned conformance action
        uses: ./nnrp-conformance-action/.github/actions/run-conformance
        with:
          protocol-version: ${{ steps.conformance-baseline.outputs.protocol-version }}
          capabilities-path: ${{ steps.conformance-baseline.outputs.capabilities-path }}
          working-directory: .
          artifact-name: ${{ steps.conformance-baseline.outputs.artifact-name }}
          adapter-command: >-
            dotnet run --project tools/Nnrp.ConformanceAdapter/Nnrp.ConformanceAdapter.csproj --
            --plan $env:NNRP_CONFORMANCE_ADAPTER_PLAN
            --output $env:NNRP_CONFORMANCE_ADAPTER_RESULTS

  docs-only:
    needs:
      - changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Skip heavy CI for docs-only change set
        run: echo "Docs-only change detected. Skipping restore, build, test, and format validation."

  required-checks:
    needs:
      - content-policy
      - changes
      - commit-policy
      - build-test
      - native-e2e
      - native-e2e-windows-x86
      - wire-host-route-e2e
      - wire-runtime-e2e
      - package-validation
      - conformance
      - docs-only
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Enforce required CI path
        shell: bash
        run: |
          if [ "${{ needs.content-policy.result }}" != "success" ]; then
            echo "Repository content policy validation failed."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.commit-policy.result }}" != "success" ]; then
            echo "PR commit policy validation failed."
            exit 1
          fi

          if [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
            if [ "${{ needs.docs-only.result }}" != "success" ]; then
              echo "Docs-only validation did not succeed."
              exit 1
            fi
            exit 0
          fi

          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "Build, test, format, or incremental coverage validation failed."
            exit 1
          fi

          if [ "${{ needs.native-e2e.result }}" != "success" ]; then
            echo "Cross-platform native artifact E2E validation failed."
            exit 1
          fi

          if [ "${{ needs.native-e2e-windows-x86.result }}" != "success" ]; then
            echo "Windows x86 native artifact E2E validation failed."
            exit 1
          fi

          if [ "${{ needs.wire-host-route-e2e.result }}" != "success" ]; then
            echo "Cross-platform host-route wire E2E validation failed."
            exit 1
          fi

          if [ "${{ needs.wire-runtime-e2e.result }}" != "success" ]; then
            echo "Cross-platform runtime-frame wire E2E validation failed."
            exit 1
          fi

          if [ "${{ needs.package-validation.result }}" != "success" ]; then
            echo "NuGet package boundary or clean-install validation failed."
            exit 1
          fi

          if [ "${{ needs.conformance.result }}" != "success" ]; then
            echo "Conformance validation failed."
            exit 1
          fi
