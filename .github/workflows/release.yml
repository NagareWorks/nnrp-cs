name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to release when running manually
        required: true
        default: main
      create_tag:
        description: Create and push the resolved release tag before publishing
        required: true
        type: boolean
        default: false
      publish_github_release:
        description: Publish or update the GitHub Release
        required: true
        type: boolean
        default: false
      publish_github_packages:
        description: Publish NuGet packages to GitHub Packages
        required: true
        type: boolean
        default: false
      publish_nuget:
        description: Publish NuGet packages to nuget.org
        required: true
        type: boolean
        default: false
      nnrp_rs_version:
        description: nnrp-rs native artifact version to package
        required: true
        default: 1.0.0-preview.4.22

permissions:
  contents: write

jobs:

  managed-validation:
    name: Validate managed source tree
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore
        run: dotnet restore Nnrp.sln

      - name: Build
        run: dotnet build Nnrp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Nnrp.sln --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format Nnrp.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Test packaging policy
        run: python -m unittest discover -s tests/Packaging.Tests -p "test_*.py"

      - name: Verify Preview4 release TODO closure
        run: python scripts/verify_release_todos.py --todo-root doc/todo/v1-preview4

  native-artifacts:
    name: Resolve nnrp-rs native artifacts
    needs: managed-validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Resolve nnrp-rs version
        id: nnrp-rs
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event_name == 'workflow_dispatch' && inputs.nnrp_rs_version || '1.0.0-preview.4.22' }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download nnrp-rs FFI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/download_nnrp_rs_artifacts.py
          --version ${{ steps.nnrp-rs.outputs.version }}
          --workflow-run-id 31666415612
          --workflow-head-sha 295f5b65ac71885b5c1b54d927b2595005038481
          --require-abi-version 4.4.0
          --output artifacts/native

      - name: Upload native artifact
        uses: actions/upload-artifact@v6
        with:
          name: native-artifacts
          path: artifacts/native/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package managed SDK and UPM bundle
    runs-on: windows-latest
    needs: native-artifacts
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      GITHUB_PACKAGES_PUBLISH_MODE: ${{ vars.GITHUB_PACKAGES_PUBLISH_MODE }}
      NUGET_PUBLISH_MODE: ${{ vars.NUGET_PUBLISH_MODE }}
      NUGET_USER: ${{ vars.NUGET_USER }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $releaseVersion = dotnet msbuild src/Nnrp.Core/Nnrp.Core.csproj -nologo -getProperty:ReleaseVersion
          $releaseVersion = $releaseVersion.Trim()
          $packageVersion = $releaseVersion
          "package_version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag_name=v$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate pushed tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          expected_tag="${{ steps.version.outputs.tag_name }}"
          actual_tag="${{ github.ref_name }}"

          if [ "$actual_tag" != "$expected_tag" ]; then
            echo "Release tag mismatch: expected $expected_tag but workflow was triggered by $actual_tag."
            exit 1
          fi

      - name: Validate manual release options
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.publish_github_release }}" = "true" ] && [ "${{ inputs.create_tag }}" != "true" ]; then
            echo "Manual GitHub Release publishing requires create_tag=true so the release is anchored to an explicit tag."
            exit 1
          fi

          if [ "${{ inputs.publish_github_packages }}" = "true" ] && [ "${{ inputs.create_tag }}" != "true" ]; then
            echo "Manual GitHub Packages publishing requires create_tag=true so package publication cannot start from an untagged ref."
            exit 1
          fi

          if [ "${{ inputs.publish_nuget }}" = "true" ] && [ "${{ inputs.create_tag }}" != "true" ]; then
            echo "Manual nuget.org publishing requires create_tag=true so package publication cannot start from an untagged ref."
            exit 1
          fi
      - name: Download native artifacts
        uses: actions/download-artifact@v7
        with:
          name: native-artifacts
          path: artifacts/native

      - name: Restore
        run: dotnet restore Nnrp.sln

      - name: Build
        run: >-
          dotnet build Nnrp.sln --configuration Release --no-restore
          -p:Version=${{ steps.version.outputs.package_version }}
          -p:PackageVersion=${{ steps.version.outputs.package_version }}
          -p:VersionSuffix=

      - name: Test
        run: dotnet test Nnrp.sln --configuration Release --no-build

      - name: Pack NuGet packages
        run: >-
          dotnet pack Nnrp.sln --configuration Release --no-build --output artifacts/packages
          -p:Version=${{ steps.version.outputs.package_version }}
          -p:PackageVersion=${{ steps.version.outputs.package_version }}
          -p:VersionSuffix=

      - name: Canonicalize NuGet package archives
        run: python scripts/canonicalize_nuget_packages.py --packages artifacts/packages

      - name: Verify NuGet package boundaries
        run: >-
          python scripts/verify_nuget_packages.py
          --packages artifacts/packages
          --version ${{ steps.version.outputs.package_version }}
          --smoke-install

      - name: Build UPM package
        run: >-
          python scripts/build_upm_package.py
          --repo-root .
          --configuration Release
          --native-root artifacts/native
          --output artifacts/upm/com.nnrp.client
          --repository-url https://github.com/${{ github.repository }}

      - name: Bundle release artifacts
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.package_version }}'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $upmZip = Join-Path (Resolve-Path 'artifacts').Path ("com.nnrp.client-{0}.zip" -f $version)
          if (Test-Path $upmZip) {
            Remove-Item $upmZip -Force
          }
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path 'artifacts/upm/com.nnrp.client'), $upmZip)

          Push-Location (Resolve-Path 'artifacts/upm/com.nnrp.client')
          try {
            $packName = (npm pack --silent).Trim()
          }
          finally {
            Pop-Location
          }

          $upmTgz = Join-Path (Resolve-Path 'artifacts').Path ("com.nnrp.client-{0}.tgz" -f $version)
          if (Test-Path $upmTgz) {
            Remove-Item $upmTgz -Force
          }
          Move-Item (Join-Path (Resolve-Path 'artifacts/upm/com.nnrp.client').Path $packName) $upmTgz

          $nugetZip = Join-Path (Resolve-Path 'artifacts').Path ("nnrp-cs-nuget-{0}.zip" -f $version)
          if (Test-Path $nugetZip) {
            Remove-Item $nugetZip -Force
          }
          Compress-Archive -Path artifacts/packages/*.nupkg -DestinationPath $nugetZip -Force

          function Compress-PackageBundle {
            param(
              [string] $Name,
              [string[]] $PackageIds
            )

            $bundlePath = Join-Path (Resolve-Path 'artifacts').Path ("{0}-{1}.zip" -f $Name, $version)
            if (Test-Path $bundlePath) {
              Remove-Item $bundlePath -Force
            }

            $packagePaths = @()
            foreach ($packageId in $PackageIds) {
              $matches = @(Get-ChildItem artifacts/packages -Filter ("{0}.{1}.nupkg" -f $packageId, $version))
              if ($matches.Count -ne 1) {
                throw "Expected exactly one package for $packageId $version, found $($matches.Count)."
              }

              $packagePaths += $matches[0].FullName
            }

            Compress-Archive -Path $packagePaths -DestinationPath $bundlePath -Force
          }

          Compress-PackageBundle `
            -Name 'nnrp-cs-client-nuget' `
            -PackageIds @('Nnrp.Core', 'Nnrp.Client', 'Nnrp.Transport.Tcp', 'Nnrp.Transport.Quic', 'Nnrp.Transport.Ipc', 'Nnrp.Transport.WebSocket', 'Nnrp.NativeBridge')
          Compress-PackageBundle `
            -Name 'nnrp-cs-server-nuget' `
            -PackageIds @('Nnrp.Core', 'Nnrp.Server', 'Nnrp.Transport.Tcp', 'Nnrp.Transport.Quic', 'Nnrp.Transport.Ipc', 'Nnrp.Transport.WebSocket', 'Nnrp.NativeBridge')

      - name: Verify final UPM archives
        run: >-
          python scripts/verify_upm_archives.py
          --package-root artifacts/upm/com.nnrp.client
          --zip artifacts/com.nnrp.client-${{ steps.version.outputs.package_version }}.zip
          --tgz artifacts/com.nnrp.client-${{ steps.version.outputs.package_version }}.tgz
          --version ${{ steps.version.outputs.package_version }}

      - name: Create or validate git tag
        if: github.event_name == 'workflow_dispatch' && inputs.create_tag
        shell: pwsh
        run: |
          git fetch --tags --force
          $tag = '${{ steps.version.outputs.tag_name }}'
          $headCommit = (git rev-parse HEAD).Trim()
          $remoteTagCommit = (git rev-list -n 1 $tag 2>$null)

          if ($LASTEXITCODE -eq 0 -and $remoteTagCommit) {
            $remoteTagCommit = $remoteTagCommit.Trim()
            if ($remoteTagCommit -ne $headCommit) {
              throw "Release tag $tag points to $remoteTagCommit, not validated commit $headCommit."
            }

            Write-Host "Release tag $tag already points to validated commit $headCommit."
          }
          else {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag $tag $headCommit
            git push origin "refs/tags/$tag"
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nnrp-cs-release-${{ steps.version.outputs.package_version }}
          path: |
            artifacts/nnrp-cs-nuget-${{ steps.version.outputs.package_version }}.zip
            artifacts/nnrp-cs-client-nuget-${{ steps.version.outputs.package_version }}.zip
            artifacts/nnrp-cs-server-nuget-${{ steps.version.outputs.package_version }}.zip
            artifacts/com.nnrp.client-${{ steps.version.outputs.package_version }}.zip
            artifacts/com.nnrp.client-${{ steps.version.outputs.package_version }}.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_github_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: nnrp-cs v${{ steps.version.outputs.package_version }}
          files: |
            artifacts/nnrp-cs-nuget-${{ steps.version.outputs.package_version }}.zip
            artifacts/nnrp-cs-client-nuget-${{ steps.version.outputs.package_version }}.zip
            artifacts/nnrp-cs-server-nuget-${{ steps.version.outputs.package_version }}.zip
            artifacts/com.nnrp.client-${{ steps.version.outputs.package_version }}.zip
            artifacts/com.nnrp.client-${{ steps.version.outputs.package_version }}.tgz

      - name: Publish NuGet packages to GitHub Packages
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_github_packages)) && env.GITHUB_PACKAGES_PUBLISH_MODE == 'enabled'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --name github --username ${{ github.actor }} --password $env:GITHUB_TOKEN --store-password-in-clear-text
          Get-ChildItem artifacts/packages/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source github --api-key $env:GITHUB_TOKEN --skip-duplicate
          }

      - name: NuGet login (OIDC to temporary API key)
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_nuget)) && env.NUGET_PUBLISH_MODE == 'trusted' && env.NUGET_USER != ''
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      - name: Publish NuGet packages to nuget.org via Trusted Publishing
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_nuget)) && env.NUGET_PUBLISH_MODE == 'trusted' && env.NUGET_USER != ''
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem artifacts/packages/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
          }

      - name: Publish NuGet packages to nuget.org via API token
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_nuget)) && env.NUGET_PUBLISH_MODE == 'token' && env.NUGET_API_KEY != ''
        shell: pwsh
        run: |
          Get-ChildItem artifacts/packages/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
          }
